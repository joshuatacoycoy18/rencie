<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Environmental Sensor Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
    :root { --bg: #050914; --card: #0f172a; --border: #1e293b; --cyan: #06b6d4; --red: #ef4444; --yellow: #f59e0b; --green: #10b981; --text: #f8fafc; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); padding: 30px; }
    .dashboard { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
    
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { font-size: 2rem; color: var(--cyan); text-shadow: 0 0 15px rgba(6,182,212,0.5); }
    .header p { color: #94a3b8; }

    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 30px; text-align: center; transition: 0.3s; }
    .card i { font-size: 3rem; color: #475569; margin-bottom: 15px; transition: 0.3s; }
    .card h3 { color: #94a3b8; font-size: 1rem; text-transform: uppercase; letter-spacing: 1px; }
    .card p { font-size: 0.8rem; color: #64748b; margin-top: 5px; }

    /* Active States */
    .card.active-sound { border-color: var(--yellow); box-shadow: 0 0 30px rgba(245,158,11,0.2); }
    .card.active-sound i { color: var(--yellow); text-shadow: 0 0 20px var(--yellow); }
    
    .card.active-rain { border-color: var(--cyan); box-shadow: 0 0 30px rgba(6,182,212,0.2); }
    .card.active-rain i { color: var(--cyan); text-shadow: 0 0 20px var(--cyan); }

    .card.active-buzzer { border-color: var(--red); box-shadow: 0 0 30px rgba(239,68,68,0.2); }
    .card.active-buzzer i { color: var(--red); animation: shake 0.4s infinite; }
    @keyframes shake { 25% { transform: rotate(10deg); } 75% { transform: rotate(-10deg); } }

    .chart-box { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; height: 350px; margin-top: 20px; }
</style>
</head>
<body>
<div class="dashboard">
    <div class="header">
        <h1><i class="fa-solid fa-leaf"></i> Environmental Monitor</h1>
        <p>Activity 5: Sound and Raindrop Sensors</p>
    </div>

    <div class="grid">
        <div class="card" id="soundCard">
            <i class="fa-solid fa-volume-high"></i>
            <h3>Sound Sensor</h3>
            <p id="soundText">No Sound</p>
        </div>
        <div class="card" id="rainCard">
            <i class="fa-solid fa-cloud-showers-heavy"></i>
            <h3>Raindrop Sensor</h3>
            <p id="rainText">No Rain</p>
        </div>
        <div class="card" id="buzzerCard">
            <i class="fa-solid fa-bell"></i>
            <h3>Buzzer Alert</h3>
            <p id="buzzerText">Inactive</p>
        </div>
    </div>

    <div class="chart-box">
        <canvas id="sensorChart"></canvas>
    </div>
</div>

<script>
    // Initialize Chart.js
    const ctx = document.getElementById('sensorChart').getContext('2d');
    const sensorChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: [],
            datasets: [
                { label: 'Sound (1=Yes, 0=No)', data: [], borderColor: '#f59e0b', backgroundColor: 'rgba(245,158,11,0.2)', step: true, fill: true },
                { label: 'Rain (1=Yes, 0=No)', data: [], borderColor: '#06b6d4', backgroundColor: 'rgba(6,182,212,0.2)', step: true, fill: true }
            ]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            scales: { y: { min: -0.1, max: 1.1, ticks: { stepSize: 1, color: '#94a3b8' }, grid: { color: '#1e293b' } },
                      x: { display: false } },
            plugins: { legend: { labels: { color: '#f8fafc' } } },
            animation: { duration: 0 }
        }
    });

    let timeCounter = 0;

    function updateDashboard() {
        fetch('/get_sensors')
            .then(res => res.json())
            .then(data => {
                // Update Sound Card
                const soundCard = document.getElementById('soundCard');
                if (data.sound_detected) {
                    soundCard.className = 'card active-sound';
                    document.getElementById('soundText').innerText = 'SOUND DETECTED!';
                } else {
                    soundCard.className = 'card';
                    document.getElementById('soundText').innerText = 'Quiet';
                }

                // Update Rain Card
                const rainCard = document.getElementById('rainCard');
                if (data.rain_detected) {
                    rainCard.className = 'card active-rain';
                    document.getElementById('rainText').innerText = 'RAIN DETECTED!';
                } else {
                    rainCard.className = 'card';
                    document.getElementById('rainText').innerText = 'Dry';
                }

                // Update Buzzer Card
                const buzzerCard = document.getElementById('buzzerCard');
                if (data.buzzer_active) {
                    buzzerCard.className = 'card active-buzzer';
                    document.getElementById('buzzerText').innerText = 'ALERT ON';
                } else {
                    buzzerCard.className = 'card';
                    document.getElementById('buzzerText').innerText = 'Inactive';
                }

                // Update Chart
                timeCounter++;
                sensorChart.data.labels.push(timeCounter);
                
                // Get the latest data from history arrays
                const latestSound = data.sound_history[data.sound_history.length - 1] || 0;
                const latestRain = data.rain_history[data.rain_history.length - 1] || 0;
                
                sensorChart.data.datasets[0].data.push(latestSound);
                sensorChart.data.datasets[1].data.push(latestRain);

                // Keep only last 30 points for visual clarity
                if (sensorChart.data.labels.length > 30) {
                    sensorChart.data.labels.shift();
                    sensorChart.data.datasets[0].data.shift();
                    sensorChart.data.datasets[1].data.shift();
                }
                sensorChart.update();
            }).catch(e => console.error(e));
    }

    setInterval(updateDashboard, 1000);
    updateDashboard();
</script>
</body>
</html>
