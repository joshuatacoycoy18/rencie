<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | EcoSense</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="dashboard-container">
        
        <div class="dash-header">
            <h1><i class="fa-solid fa-leaf"></i> EcoSense Dashboard</h1>
            <a href="/" class="btn-back"><i class="fa-solid fa-house"></i> Home</a>
        </div>

        <div class="grid">
            <!-- Sound Card -->
            <div class="card" id="soundCard">
                <i class="fa-solid fa-volume-high"></i>
                <h3>Acoustic Level</h3>
                <p id="soundText">Quiet</p>
            </div>

            <!-- Rain Card -->
            <div class="card" id="rainCard">
                <i class="fa-solid fa-cloud-showers-heavy"></i>
                <h3>Precipitation</h3>
                <p id="rainText">Dry</p>
            </div>

            <!-- Buzzer Card -->
            <div class="card" id="buzzerCard">
                <i class="fa-solid fa-bell"></i>
                <h3>Alert System</h3>
                <p id="buzzerText">Inactive</p>
            </div>
        </div>

        <div class="chart-box">
            <canvas id="sensorChart"></canvas>
        </div>
    </div>

    <script>
        // Setup Chart.js na may Eco-Tech theme
        const ctx = document.getElementById('sensorChart').getContext('2d');
        
        // Gradient para sa Sound (Yellow)
        let gradientSound = ctx.createLinearGradient(0, 0, 0, 400);
        gradientSound.addColorStop(0, 'rgba(246, 211, 101, 0.4)');
        gradientSound.addColorStop(1, 'rgba(246, 211, 101, 0)');
        
        // Gradient para sa Rain (Blue)
        let gradientRain = ctx.createLinearGradient(0, 0, 0, 400);
        gradientRain.addColorStop(0, 'rgba(0, 242, 254, 0.4)');
        gradientRain.addColorStop(1, 'rgba(0, 242, 254, 0)');

        const sensorChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    { label: 'Sound Detected', data: [], borderColor: '#f6d365', backgroundColor: gradientSound, step: true, fill: true, borderWidth: 2, pointRadius: 0 },
                    { label: 'Rain Detected', data: [], borderColor: '#00f2fe', backgroundColor: gradientRain, step: true, fill: true, borderWidth: 2, pointRadius: 0 }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                scales: { 
                    y: { min: -0.1, max: 1.1, ticks: { stepSize: 1, color: '#64748b', font: { family: 'Space Mono' } }, grid: { color: 'rgba(255,255,255,0.05)' } },
                    x: { display: false } 
                },
                plugins: { 
                    legend: { labels: { color: '#e2e8f0', font: { family: 'Outfit', size: 14 } } } 
                },
                animation: { duration: 0 },
                interaction: { mode: 'index', intersect: false }
            }
        });

        let timeCounter = 0;

        function updateDashboard() {
            fetch('/get_sensors')
                .then(res => res.json())
                .then(data => {
                    // Update Sound Card
                    const soundCard = document.getElementById('soundCard');
                    const soundText = document.getElementById('soundText');
                    if (data.sound_detected) {
                        soundCard.className = 'card sound-active';
                        soundText.innerText = 'SOUND DETECTED!';
                    } else {
                        soundCard.className = 'card';
                        soundText.innerText = 'Quiet';
                    }

                    // Update Rain Card
                    const rainCard = document.getElementById('rainCard');
                    const rainText = document.getElementById('rainText');
                    if (data.rain_detected) {
                        rainCard.className = 'card rain-active';
                        rainText.innerText = 'RAIN DETECTED!';
                    } else {
                        rainCard.className = 'card';
                        rainText.innerText = 'Dry';
                    }

                    // Update Buzzer Card
                    const buzzerCard = document.getElementById('buzzerCard');
                    const buzzerText = document.getElementById('buzzerText');
                    if (data.buzzer_active) {
                        buzzerCard.className = 'card buzzer-active';
                        buzzerText.innerText = 'ALERT ACTIVE';
                    } else {
                        buzzerCard.className = 'card';
                        buzzerText.innerText = 'Inactive';
                    }

                    // Update Chart
                    timeCounter++;
                    sensorChart.data.labels.push(timeCounter);
                    
                    const latestSound = data.sound_history[data.sound_history.length - 1];
                    const latestRain = data.rain_history[data.rain_history.length - 1];
                    
                    sensorChart.data.datasets[0].data.push(latestSound);
                    sensorChart.data.datasets[1].data.push(latestRain);

                    if (sensorChart.data.labels.length > 30) {
                        sensorChart.data.labels.shift();
                        sensorChart.data.datasets[0].data.shift();
                        sensorChart.data.datasets[1].data.shift();
                    }
                    sensorChart.update();
                }).catch(e => console.error(e));
        }

        setInterval(updateDashboard, 1000);
        updateDashboard();
    </script>
</body>
</html>
